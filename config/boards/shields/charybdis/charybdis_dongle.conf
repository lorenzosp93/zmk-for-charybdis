CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Two keyboard peripherals plus the existing five Bluetooth host profiles.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# This Prospector was assembled without an APDS9960 sensor.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50

CONFIG_ZMK_WPM=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_IDLE_TIMEOUT=180000

# The custom screen needs more than the adapter's 10 KB default graphics heap.
# A half-screen transfer buffer frees RAM for the UI and display-thread stack.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_VDB_SIZE=50
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_40=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# Studio is hosted by the Prospector; keyboard halves remain peripherals.
CONFIG_ZMK_STUDIO=y

# The custom screen honours the Prospector layer-capitalisation setting.
CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=y
